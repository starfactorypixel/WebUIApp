<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UDP Pixel Viewer</title>
  <script src="utils.js"></script>
  <script src="BlockInfo.js"></script>
  <style>
	canvas {
		border: 1px solid black;
	}
	
	.params {
		display: grid;
		width: 308px;
	}
	
	.params input {
		width: 64px;
	}

	ui-element
	{
		  display: inline-block;
		border: 1px solid black;
		padding: 12px;
	}
	ui-element .title
	{
		font-weight: bold;
	}
	
	.device-block
	{
		display: inline-block;
		background-color: aqua;
		margin: 10px;
		padding: 10px;
		border: 1px solid #aaa;
		border-radius: 6px;
		width: 220px;
	}

	.objs
	{
		display: grid;
		grid-auto-flow: column;
		grid-template-rows: repeat(8, auto);
	}
	.stream-list
	{
		padding: 6px;
		background-color: aquamarine;
		margin: 6px;
		border: 1px black solid;
		text-align: center;
	}

	.radios label
	{
		display: flex;
		padding: 6px;
		background-color: bisque;
	}
  </style>
</head>
<body>




<div class="ui-elements">
	<ui-element type="button" id="0x0164" config='{"name":"Out 1 [${value}]", "type": "uint8", "scale": 1}'></ui-element>
	<ui-element type="button" id="0x0165" config='{"name":"Out 2 [${value}]", "type": "uint8", "scale": 1}'></ui-element>
	<ui-element type="button" id="0x0166" config='{"name":"Out 3 [${value}]", "type": "uint8", "scale": 1}'></ui-element>
	<ui-element type="button" id="0x0167" config='{"name":"Out 4 [${value}]", "type": "uint8", "scale": 1}'></ui-element>

	<ui-element type="button" id="0x0169" config='{"name":"Out 6 ${icon1}", "type": "uint8", "scale": 1}'></ui-element>
	<ui-element type="button" id="0x016A" config='{"name":"Out 7 [${value}]", "type": "uint8", "scale": 1}'></ui-element>
	<ui-element type="button" id="0x016B" config='{"name":"POut 1 [${value}]", "type": "uint8", "scale": 1}'></ui-element>

	<ui-element type="value" id="0x0116" config='{"name":"Power: ${value:%+5d}W", "type": "int16", "scale": 1}'></ui-element>

	<ui-element type="value" id="0x016C" config='{"name":"In1: ${value:%1.3f}V", "type": "uint16", "scale": 1000}'></ui-element>
	<ui-element type="value" id="0x016D" config='{"name":"In2: ${value:%1.3f}V", "type": "uint16", "scale": 1000}'></ui-element>
	<ui-element type="value" id="0x016E" config='{"name":"In3: ${value:%1.3f}V", "type": "uint16", "scale": 1000}'></ui-element>
	<ui-element type="value" id="0x016F" config='{"name":"In4: ${value:%1.3f}V", "type": "uint16", "scale": 1000}'></ui-element>
	<ui-element type="value" id="0x0170" config='{"name":"In5: ${value:%1.3f}V", "type": "uint16", "scale": 1000}'></ui-element>
	<ui-element type="value" id="0x0171" config='{"name":"In6: ${value:%1.3f}V", "type": "uint16", "scale": 1000}'></ui-element>
	<ui-element type="value" id="0x0172" config='{"name":"In7: ${value:%1.3f}V", "type": "uint16", "scale": 1000}'></ui-element>
	<ui-element type="value" id="0x0173" config='{"name":"In8: ${value:%1.3f}V", "type": "uint16", "scale": 1000}'></ui-element>

	<br>

	<ui-element type="radio" id="0x0106" config='{"name":"КПП 1", "radios": "0:N,1:F,2:R,4:L,8:B", "readonly": false, "type": "uint8"}'></ui-element>
	
</div>




<div id="blocksContainer"></div>



<script>


class UiElement extends HTMLElement {
  connectedCallback() {
    console.log("Mounted UI element:", this.getAttribute("config"));
  }
}
customElements.define("ui-element", UiElement);





	loadJson("Blocks.json");






	const socket = new WebSocket('ws://localhost:8080');
	socket.onopen = function(event)
	{
		console.log("WS: Соединение установлено:", event.target.url);
		
		//GetMode('RGB');
		//GetMode('W1');
		//GetMode('W2');
		WSOnOpenEvent();
	};
	socket.onmessage = (message) => 
	{
		let msg;
		try {
			msg = JSON.parse(message.data);
		} catch (err) {
			console.error('Ошибка JSON:', err);
			return;
		}

		if(msg.data.type == 0x05)
		{
			console.log(msg);

			if(msg.data.id == 1)
			{
				processPacket(msg.data.data);
			}
		}
		
		SetUIValue(msg.data.id, msg.data.data);
	};




	function SendData(type, id, bytes)
	{
		if(!Number.isInteger(type))
			throw new TypeError('SendRaw: type param must be an Int');
		if(!Number.isInteger(id))
			throw new TypeError('SendRaw: id param must be an Int');
		if(!Array.isArray(bytes))
			throw new TypeError('SendRaw: bytes param must be an Array');
		
		const packet = 
		{
			cmd: "Raw",
			type: type,
			id: id,
			bytes: bytes
		};
		socket.send( JSON.stringify(packet) );
	}








	function Pixel_Subscribe(params)
	{
		if(!Array.isArray(params))
			throw new TypeError('Pixel_Subscribe: params must be an Array');
		
		let obj = 
		{
			cmd: "CANIDSub",
			data: params
		};
		
		socket.send( JSON.stringify(obj) );
	}

	function Pixel_Unsubscribe(params)
	{
		if(!Array.isArray(params))
			throw new TypeError('Pixel_Unsubscribe: params must be an Array');
		
		let obj = 
		{
			cmd: "CANIDUnsub",
			data: params
		};
		
		socket.send( JSON.stringify(obj) );
	}












function WSOnOpenEvent()
{

document.querySelectorAll('ui-element').forEach((obj, index) => 
{
	const obj_type = obj.getAttribute('type');
	const obj_id = parseInt(obj.getAttribute('id'), 16);
	const obj_cfg = JSON.parse(obj.getAttribute('config'));
	
	switch(obj_type)
	{
		case 'button':
		{
			let button = document.createElement('button');
			//button.innerHTML = '***';
			button.addEventListener('click', () => 
			{
				//obj.dataset.next_click = !obj.dataset.next_click;
				SendData(0x15, obj_id, [0x02]);
			});
			
			

			obj.appendChild(button);

			SetUIValue(obj_id);

			Pixel_Subscribe( [obj_id] );
			
			
			break;
		}

		case 'value':
		{
			let el = document.createElement('div');
			el.innerHTML = "load";

			obj.appendChild(el);
			Pixel_Subscribe( [obj_id] );
			
			break;
		}
		
		// 
		case 'stream':
		{
			const el_root = document.createElement('div');
			el_root.innerHTML = `
				<div class="title">${obj_cfg.name}</div>
				<div class="objs"></div>
				<div class="ctrl"></div>
			`;
			
			const button = document.createElement('button');
			button.textContent = 'Запрос';
			button.addEventListener('click', () =>
			{
				SendData(0x15, obj_id, [0x11]);
			});
			
			el_root.querySelector('.ctrl').appendChild(button);
			obj.appendChild(el_root);
			
			Pixel_Subscribe([obj_id]);
			
			break;
		}
		
		// 
		case 'radio':
		{
			const el_root = document.createElement('div');
			el_root.innerHTML = `
				<div class="title">${obj_cfg.name}</div>
				<div class="radios"></div>
			`;


			obj_cfg.radios.split(',').forEach(item => 
			{
				const [value, name] = item.split(':');
				
				const radio = document.createElement('input');
				radio.type = 'radio';
				radio.name = 'id' + obj_id;
				radio.value = value;
				radio.disabled = obj_cfg.readonly;
				radio.addEventListener('click', () => 
				{
					SendData(0x15, obj_id, [0x01, value]);			// нада value учитывая config.type слать
				});
				
				const label = document.createElement('label');
				label.textContent = name;
				label.prepend(radio);

				el_root.querySelector('.radios').appendChild(label);
			});
			
			obj.appendChild(el_root);
			
			Pixel_Subscribe([obj_id]);
			
			break;
		}
	}
});

};


// id - int число
// rx_data - массив принятых байт
function SetUIValue(id, rx_data = [])
{
	let obj = document.querySelector(`ui-element[id="${toHex4(id)}"]`);
	if(obj !== null)
	{
		let config = JSON.parse(obj.getAttribute('config'));
		let value_raw = readNumberFromArray(rx_data, 1, config.type, true);
		let value = value_raw / config.scale;
		let data = { value: value, value_raw: value_raw, icon1: icon1(value_raw) };
		
		switch( obj.getAttribute('type') )
		{
			case 'button':
			{
				//obj.querySelector('button').innerHTML = config.name.replace(/%(\w+)%/g, (_, key) => data[key]);
				obj.querySelector('button').innerHTML = sprintfNamed(config.name, data);
				
				break;
			}

			case 'value':
			{
				//obj.querySelector('div').innerHTML = config.name.replace(/%(\w+)%/g, (_, key) => data[key]);
				obj.querySelector('div').innerHTML = sprintfNamed(config.name, data);
				
				break;
			}
			
			// 
			case 'stream':
			{
				const rx_num = readNumberFromArray(rx_data, 1, 'uint8', true);
				const rx_val_raw = readNumberFromArray(rx_data, 2, config.type, true);
				//rx_val_raw += getRandomInt(3200, 4200);
				const rx_value = rx_val_raw / config.scale;
				const template_data = {number: rx_num, value: rx_value, value_raw: rx_val_raw};
				
				const objs = obj.querySelector('.objs');
				if(objs === null) break;
				
				let cell_obj = objs.querySelector(`span[data-number="${rx_num}"]`);
				if(cell_obj !== null)
				{
					cell_obj.textContent = sprintfNamed(config.format, template_data);
				}
				else
				{
					cell_obj = document.createElement('span');
					cell_obj.classList.add('stream-list');
					cell_obj.dataset.number = rx_num;
					cell_obj.textContent = sprintfNamed(config.format, template_data);
					
					objs.appendChild(cell_obj);
				}
				
				break;
			}

			// 
			case 'radio':
			{
				let value_raw = readNumberFromArray(rx_data, 1, config.type, true);

				const radio = obj.querySelector('.radios input[value="' + value_raw + '"]');
				if(radio === null) break;
				
				radio.checked = true;
				
				break;
			}
		}
	};
}

function icon1(value)
{
	if(value === null) return '🟡';
	if(value === 0) return '🔴';
	return '🟢';
}









</script>

</body>
</html>
