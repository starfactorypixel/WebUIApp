<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>WebUI demo</title>
	<link rel="stylesheet" href="css/client.css">
</head>
<body>


<div class="tabs" id="myTabs">
	
	<div data-tab-title="Передние моторы">
		<ui-element type="value" obj="0x010E" config='{"name":"Обороты М1","format":"${value:%d} об/мин","type":"uint16","chart":{"count":100,"mode":"line"}}'></ui-element>
		<ui-element type="value" obj="0x0110" config='{"name":"Скорость М1","format":"${value:%1.1f} км/ч","type":"uint16","scale":10,"chart":{"count":100,"mode":"fill"}}'></ui-element>

		<ui-element type="value" obj="0x0116" config='{"name":"Мощность М1","format":"${value:%+d} W","type":"int16","chart":{"count":100,"mode":"fill"}}'></ui-element>
		<ui-element type="value" obj="0x011A" config='{"name":"Темп. мотора 1","format":"${value:%d}°C ${expr}","type":"int16","expr":[[">",120,"CRIT"],[">",70,"WARN"],["NORM"]],"chart":{"count":64,"mode":"line"}}'></ui-element>
		<ui-element type="value" obj="0x011C" config='{"name":"Темп. контроллера 1","format":"${value:%d}°C ${expr}","type":"int16","expr":[[">",120,"CRIT"],[">",70,"WARN"],["NORM"]],"chart":{"count":64,"mode":"line"}}'></ui-element>
		<br>
		<ui-element type="value" obj="0x010F" config='{"name":"Обороты М2","format":"${value:%d} об/мин","type":"uint16","chart":{"count":100,"mode":"line"}}'></ui-element>
		<ui-element type="value" obj="0x0111" config='{"name":"Скорость М2","format":"${value:%1.1f} км/ч","type":"uint16","scale":10,"chart":{"count":100,"mode":"fill"}}'></ui-element>
		<ui-element type="value" obj="0x0113" config='{"name":"Напряжение М2","format":"${value:%1.1f} V","type":"uint16","scale":10}'></ui-element>
		<ui-element type="value" obj="0x0115" config='{"name":"Ток М2","format":"${value:%+5.1f} A","type":"int16","scale":10,"chart":{"count":100,"mode":"line"}}'></ui-element>
		<ui-element type="value" obj="0x0117" config='{"name":"Мощность М2","format":"${value:%+d} W","type":"int16","chart":{"count":100,"mode":"fill"}}'></ui-element>
		<ui-element type="value" obj="0x011B" config='{"name":"Темп. мотора 2","format":"${value:%d}°C ${expr}","type":"int16","expr":[[">",120,"CRIT"],[">",70,"WARN"],["NORM"]],"chart":{"count":64,"mode":"line"}}'></ui-element>
		<ui-element type="value" obj="0x011D" config='{"name":"Темп. контроллера 2","format":"${value:%d}°C ${expr}","type":"int16","expr":[[">",120,"CRIT"],[">",70,"WARN"],["NORM"]],"chart":{"count":64,"mode":"line"}}'></ui-element>
		<br>
		<ui-element type="range" obj="0x0104,0x0105" config='{"name":"Газ М1+М2","format":"${value:%d}","type":"uint16","min":0,"max":1023,"step":1}'></ui-element>
		<ui-element type="radio" obj="0x0106,0x0107" config='{"name":"КПП М1+М2","radios":"0:N,1:F,2:R,4:L,8:B","type":"uint8"}'></ui-element>
		<ui-element type="button" obj="0x0108,0x0109" config='{"name":"Рекуперация М1+М2","format":"${icon1}[${txt}] ${count}","type":"uint8","txt":"255:ON,0:OFF"}'></ui-element>
		<ui-element type="button" obj="0x010A,0x010B" config='{"name":"Зажигание М1+М2","format":"${icon1}[${txt}] ${count}","type":"uint8","txt":"255:ON,0:OFF"}'></ui-element>
		<ui-element type="value" obj="0x011E" config='{"name":"Одометр","format":"${value:%1.1f} км","type":"uint32","scale":10}'></ui-element>
		<ui-element type="stream" obj="0x011F" config='{"name":"Внешние датчики t°","format":"${number:%02d}: ${value:%d}°C","type":"int8"}'></ui-element>
	</div>

	<div data-tab-title="Задние моторы">

		<ui-element type="value" obj="0x013E" config='{"name":"Обороты М1","format":"${value:%d} об/мин","type":"uint16","chart":{"count":100,"mode":"line"}}'></ui-element>
		<ui-element type="value" obj="0x013F" config='{"name":"Обороты М2","format":"${value:%d} об/мин","type":"uint16","chart":{"count":100,"mode":"line"}}'></ui-element>
		<ui-element type="value" obj="0x0140" config='{"name":"Скорость М1","format":"${value:%1.1f} км/ч","type":"uint16","scale":10,"chart":{"count":100,"mode":"fill"}}'></ui-element>
		<ui-element type="value" obj="0x0141" config='{"name":"Скорость М2","format":"${value:%1.1f} км/ч","type":"uint16","scale":10,"chart":{"count":100,"mode":"fill"}}'></ui-element>

		<ui-element type="value" obj="0x0144" config='{"name":"Ток М1","format":"${value:%+5.1f} A","type":"int16","scale":10,"chart":{"count":100,"mode":"line"}}'></ui-element>
		<ui-element type="value" obj="0x0145" config='{"name":"Ток М2","format":"${value:%+5.1f} A","type":"int16","scale":10,"chart":{"count":100,"mode":"line"}}'></ui-element>
		<ui-element type="value" obj="0x0146" config='{"name":"Мощность М1","format":"${value:%+d} W","type":"int16","chart":{"count":100,"mode":"fill"}}'></ui-element>
		<ui-element type="value" obj="0x0147" config='{"name":"Мощность М2","format":"${value:%+d} W","type":"int16","chart":{"count":100,"mode":"fill"}}'></ui-element>
		<ui-element type="value" obj="0x014A" config='{"name":"Темп. мотора 1","format":"${value:%d}°C ${expr}","type":"int16","expr":[[">",120,"CRIT"],[">",70,"WARN"],["NORM"]],"chart":{"count":64,"mode":"line"}}'></ui-element>
		<ui-element type="value" obj="0x014B" config='{"name":"Темп. мотора 2","format":"${value:%d}°C ${expr}","type":"int16","expr":[[">",120,"CRIT"],[">",70,"WARN"],["NORM"]],"chart":{"count":64,"mode":"line"}}'></ui-element>
		<ui-element type="value" obj="0x014C" config='{"name":"Темп. контроллера 1","format":"${value:%d}°C ${expr}","type":"int16","expr":[[">",120,"CRIT"],[">",70,"WARN"],["NORM"]],"chart":{"count":64,"mode":"line"}}'></ui-element>
